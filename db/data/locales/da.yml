      next_only: ".input {$nextDays :number} .match $nextDays one {{ {#mainLabel}Tomorrow
        is{/mainLabel}{#br/}{#mainValue}{$nextName}{/mainValue} }}* {{ {#mainValue}{$nextDays}{/mainValue}{#mainLabel}
