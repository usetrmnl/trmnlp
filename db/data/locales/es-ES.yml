      connections: ".input {$value :number} .match $value one {{{$value :number} conexión}}
        many {{{$value :number} conexiones}} * {{{$value :number} conexiones}}"
      forks: ".input {$value :number} .match $value one {{{$value :number} fork}}
        many {{{$value :number} forks}} * {{{$value :number} forks}}"
      installs: ".input {$value :number} .match $value zero {{Sin instalaciones}}
        one {{{$value :number} instalación}} * {{{$value :number} instalaciones}}"
      and_more: y {$value :number} más
