      error_new_subtitle: Esto no debería pasar.
      error_self_title: No has publicado ninguna receta.
      error_self_subtitle: Aprende cómo publicar la primera en https://help.usetrmnl.com/en/articles/9510536-private-plugins
      error_author_id_title: 'El usuario #{$authorId} no ha publicado ninguna receta.'
      error_author_id_subtitle: No se ha encontrado ninguna receta asociada a este
        ID.
      error_recipe_ids_title: No se ha encontrado el ID de la receta.
      error_recipe_ids_subtitle: Añade un ID de receta para empezar.
