      connections: ".input {$value :number} .match $value one {{{$value :number} connexion}}
        many {{{$value :number} connexions}} * {{{$value :number} connexions}}"
      forks: ".input {$value :number} .match $value one {{{$value :number} duplication}}
        many {{{$value :number} duplications}} * {{{$value :number} duplications}}"
      installs: ".input {$value :number} .match $value zero {{No install}} one {{{$value
        :number} install}} * {{{$value :number} installs}}"
      and_more: et {$value :number} de plus
